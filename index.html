<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Messaggio Finale</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  isolation:isolate;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 50% 43%,#1a1a1a 0%,#090909 45%,#000 100%);
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  opacity:.12;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 5px);
}

#vignette{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
  background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.72) 100%);
}

/* =========================
   SCHERMATA
========================= */

.screen{
  width:100%;
  min-height:100svh;
  padding:
    max(28px,env(safe-area-inset-top))
    16px
    max(24px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
  z-index:2;
}

.status{
  color:#777;
  font-size:9px;
  font-weight:800;
  letter-spacing:.30em;
  text-transform:uppercase;
  text-align:center;
  margin-bottom:24px;
  opacity:0;
  animation:fadeIn .7s .2s forwards;
}

/* =========================
   FRASE
   IMPORTANTE:
   le parole hanno uno spazio fisico
   riservato. Una volta entrate restano
   visibili e non vengono più animate.
========================= */

.message{
  width:min(100%,720px);
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  align-content:center;
  gap:10px 9px;
  padding:8px 2px;
  margin:0 auto;
}

.word{
  display:block;
  flex:0 0 auto;
  white-space:nowrap;
  opacity:0;
  visibility:hidden;
  transform:translate3d(0,30px,0) scale(.78);
  filter:blur(8px);

  font-size:clamp(1.55rem,8.3vw,5.3rem);
  line-height:.95;
  font-weight:900;
  letter-spacing:-.035em;
  text-shadow:0 0 16px rgba(255,255,255,.20);

  /* Nessuna transizione automatica dopo l'ingresso */
  will-change:opacity,transform,filter;
}

.word.enter{
  visibility:visible;
  animation:wordEnter .62s cubic-bezier(.18,.82,.25,1) forwards;
}

.word.stable{
  visibility:visible;
  opacity:1;
  transform:none;
  filter:none;
  animation:none !important;
}

/* Stato finale: tutte le parole restano ferme. */
.message.done .word{
  visibility:visible !important;
  opacity:1 !important;
  transform:none !important;
  filter:none !important;
  animation:none !important;
}

.message.done{
  animation:softBreath 2.8s ease-in-out infinite;
}

.tap{
  margin-top:24px;
  color:#555;
  font-size:8px;
  letter-spacing:.16em;
  text-transform:uppercase;
  text-align:center;
  opacity:1;
}

/* =========================
   TIMER
========================= */

.timer-wrap{
  display:none;
  width:min(94vw,460px);
  opacity:0;
}

.timer-wrap.active{
  display:block;
  animation:timerEnter .75s cubic-bezier(.2,.9,.2,1) forwards;
}

.bomb{
  position:relative;
  width:100%;
  padding:18px 13px 15px;
  border:2px solid #252525;
  border-radius:7px;
  background:
    linear-gradient(145deg,#222 0%,#0b0b0b 48%,#181818 100%);
  box-shadow:
    0 18px 45px rgba(0,0,0,.85),
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -2px 0 rgba(0,0,0,.95);
}

.bomb:before,.bomb:after{
  content:"";
  position:absolute;
  left:9px;
  right:9px;
  height:5px;
  background:#050505;
  border:1px solid #333;
}

.bomb:before{top:8px}
.bomb:after{bottom:8px}

.screws{
  position:absolute;
  inset:10px;
  pointer-events:none;
}

.screw{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#aaa,#333 55%,#080808);
  box-shadow:0 1px 2px #000;
}
.screw:nth-child(1){top:0;left:0}
.screw:nth-child(2){top:0;right:0}
.screw:nth-child(3){bottom:0;left:0}
.screw:nth-child(4){bottom:0;right:0}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 5px 13px;
  color:#888;
  font-size:8px;
  font-weight:800;
  letter-spacing:.20em;
  text-transform:uppercase;
}

.led{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff1515;
  box-shadow:0 0 7px #ff1515,0 0 18px rgba(255,0,0,.45);
  animation:ledPulse 1s infinite;
}

.display{
  width:100%;
  min-height:142px;
  padding:14px 7px;
  border:7px solid #080808;
  border-radius:4px;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),
    linear-gradient(#180000,#070000);
  box-shadow:
    inset 0 0 25px #000,
    0 0 0 1px #333,
    0 0 24px rgba(255,0,0,.10);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.display:after{
  content:"";
  position:absolute;
  pointer-events:none;
}

.timer{
  color:#ff3030;
  font-family:"Courier New",monospace;
  font-size:clamp(4.5rem,23vw,9.2rem);
  line-height:.82;
  font-weight:900;
  letter-spacing:.01em;
  font-variant-numeric:tabular-nums;
  text-shadow:
    0 0 3px #ff0000,
    0 0 12px rgba(255,0,0,.75),
    0 0 30px rgba(255,0,0,.35);
}

.timer.danger{animation:timerPulse .7s infinite}
.timer.critical{animation:critical .23s infinite}

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:13px;
  padding:0 4px;
}

.knob{
  width:30px;
  height:30px;
  border-radius:50%;
  border:3px solid #111;
  background:radial-gradient(circle at 35% 30%,#555,#1c1c1c 48%,#080808 70%);
  box-shadow:0 2px 4px #000,inset 0 1px 1px #777;
}

.switch{
  width:68px;
  height:20px;
  border-radius:3px;
  background:#080808;
  border:1px solid #333;
  position:relative;
}
.switch:before{
  content:"";
  position:absolute;
  width:18px;
  height:12px;
  top:3px;
  left:5px;
  border-radius:2px;
  background:#7d0000;
  box-shadow:0 0 8px rgba(255,0,0,.5);
}

.progress{
  height:3px;
  margin-top:12px;
  background:#270000;
  overflow:hidden;
}
.progress>div{
  height:100%;
  width:100%;
  transform-origin:left;
  background:#ff1515;
  box-shadow:0 0 8px #ff1515;
  transition:transform 1s linear;
}

.warning{
  margin-top:12px;
  color:#777;
  font-size:8px;
  font-weight:800;
  letter-spacing:.25em;
  text-align:center;
}

/* =========================
   FINE
========================= */

.expired{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  background:#050000;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:25px;
}

.expired.active{
  display:flex;
  animation:expiredIn .5s forwards;
}

.expired h1{
  margin:0;
  color:#ff2020;
  font-size:clamp(2.1rem,10vw,6rem);
  letter-spacing:.06em;
  text-shadow:0 0 18px rgba(255,0,0,.6);
}

.expired p{
  color:#8b4b4b;
  font-size:9px;
  letter-spacing:.25em;
  text-transform:uppercase;
}

/* =========================
   ANIMAZIONI
========================= */

@keyframes fadeIn{to{opacity:1}}

@keyframes wordEnter{
  0%{
    opacity:0;
    transform:translate3d(0,30px,0) scale(.78);
    filter:blur(8px);
  }
  65%{
    opacity:1;
    transform:translate3d(0,-4px,0) scale(1.04);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:none;
    filter:none;
  }
}

@keyframes softBreath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.008)}
}

@keyframes timerEnter{
  0%{opacity:0;transform:scale(1.28);filter:blur(10px)}
  70%{opacity:1;transform:scale(.97);filter:blur(0)}
  100%{opacity:1;transform:scale(1)}
}

@keyframes ledPulse{
  50%{opacity:.45;box-shadow:0 0 3px #ff1515}
}

@keyframes timerPulse{
  50%{transform:scale(1.035);opacity:.7}
}

@keyframes critical{
  50%{transform:scale(1.08);opacity:.45}
}

@keyframes expiredIn{
  from{opacity:0;filter:brightness(3)}
  to{opacity:1;filter:brightness(1)}
}

/* Smartphone piccoli */
@media(max-width:360px){
  .screen{padding-left:12px;padding-right:12px}
  .status{margin-bottom:18px}
  .message{gap:8px 7px}
  .word{font-size:clamp(1.36rem,7.9vw,2.25rem)}
  .display{min-height:120px}
  .timer{font-size:4.25rem}
}

/* Smartphone alti: lascia più aria */
@media(min-height:750px) and (max-width:600px){
  .status{margin-bottom:30px}
  .message{gap:11px 9px}
}

/* Landscape */
@media(orientation:landscape) and (max-height:520px){
  .screen{
    padding-top:15px;
    padding-bottom:15px;
  }
  .status{margin-bottom:8px}
  .message{max-width:800px;gap:7px 8px}
  .word{font-size:clamp(1.2rem,5.8vw,3.5rem)}
  .timer-wrap{max-width:390px}
  .display{min-height:100px}
  .timer{font-size:clamp(3.2rem,14vw,6rem)}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>
<div id="vignette"></div>

<main class="screen">
  <div class="status">MESSAGGIO DECODIFICATO</div>

  <section class="message" id="message" aria-live="polite"></section>

  <section class="timer-wrap" id="timerWrap">
    <div class="bomb">
      <div class="screws">
        <span class="screw"></span>
        <span class="screw"></span>
        <span class="screw"></span>
        <span class="screw"></span>
      </div>

      <div class="panel-title">
        <span>WARNING SYSTEM</span>
        <span class="led"></span>
      </div>

      <div class="display">
        <div class="timer" id="timer">02:00</div>
      </div>

      <div class="controls">
        <span class="knob"></span>
        <span class="switch"></span>
        <span class="knob"></span>
      </div>

      <div class="progress"><div id="progressBar"></div></div>
      <div class="warning">TEMPO RIMANENTE — MUOVETEVI</div>
    </div>
  </section>

  <div class="tap" id="tap">Il conto alla rovescia inizierà automaticamente</div>
</main>

<section class="expired" id="expired">
  <h1>TEMPO SCADUTO</h1>
  <p>La sequenza è terminata</p>
</section>

<script>
/*
  FRASE FINALE
  La logica di animazione è stata resa deterministica:
  ogni parola passa da ENTER a STABLE e non può più
  essere resa invisibile.
*/
const phrase = "Correte in salone per terminare il gioco";

const message = document.getElementById("message");
const timerWrap = document.getElementById("timerWrap");
const timer = document.getElementById("timer");
const progressBar = document.getElementById("progressBar");
const expired = document.getElementById("expired");
const tap = document.getElementById("tap");

let seconds = 120;
let timerInterval = null;

function createMessage(){
  const words = phrase.trim().split(/\s+/);
  message.innerHTML = "";

  words.forEach((word,index)=>{
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = word;
    message.appendChild(span);

    // Una sola animazione di ingresso.
    setTimeout(()=>{
      span.classList.add("enter");

      // Dopo l'animazione diventa definitivamente STABLE.
      setTimeout(()=>{
        span.classList.remove("enter");
        span.classList.add("stable");
      },680);

    },450 + index * 650);
  });

  const finalWordTime = 450 + (words.length - 1) * 650;
  const allStableTime = finalWordTime + 760;

  setTimeout(()=>{
    // Forza lo stato finale di TUTTE le parole.
    message.querySelectorAll(".word").forEach(word=>{
      word.classList.remove("enter");
      word.classList.add("stable");
    });
    message.classList.add("done");
  },allStableTime);

  // La frase rimane completamente leggibile per un po'.
  setTimeout(startTimerSequence, allStableTime + 2200);
}

function startTimerSequence(){
  message.style.transition = "opacity .55s ease, transform .55s ease, filter .55s ease";
  message.style.opacity = "0";
  message.style.transform = "scale(1.03)";
  message.style.filter = "blur(9px)";
  tap.style.opacity = "0";

  setTimeout(()=>{
    message.style.display = "none";
    tap.style.display = "none";
    timerWrap.classList.add("active");
    startCountdown();
  },600);
}

function formatTime(value){
  const min = Math.floor(value/60).toString().padStart(2,"0");
  const sec = (value%60).toString().padStart(2,"0");
  return min + ":" + sec;
}

function startCountdown(){
  timer.textContent = formatTime(seconds);

  timerInterval = setInterval(()=>{
    seconds--;
    const safeSeconds = Math.max(seconds,0);

    timer.textContent = formatTime(safeSeconds);
    progressBar.style.transform = "scaleX(" + (safeSeconds/120) + ")";

    if(seconds <= 30) timer.classList.add("danger");
    if(seconds <= 10) timer.classList.add("critical");

    if(seconds > 0 && seconds <= 10){
      beep(150,.08);
    }

    if(seconds <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      setTimeout(()=>expired.classList.add("active"),300);
    }
  },1000);
}

function beep(frequency,duration){
  try{
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(.035,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime + duration);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }catch(e){}
}

window.addEventListener("load",createMessage);
</script>
</body>
</html>
